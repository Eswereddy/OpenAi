name: CI

# Runs the project's own existing test suite (unit + smoke, see package.json)
# automatically on every push and pull request. Doesn't add or change any
# tests — it just runs the ones already in the repo so "npm test passes"
# is a visible, verifiable badge instead of a claim in the README.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit + smoke tests
        run: npm test
